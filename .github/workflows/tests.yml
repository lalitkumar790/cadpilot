name: Python tests

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Compile Python sources
        run: python -m compileall -q AICopilot freecad_mcp scripts
      - name: Run tests
        run: python -m pytest -q

  windows-script-validation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse Windows setup and uninstall scripts
        shell: pwsh
        run: |
          $files = @(
            "scripts/setup_windows.ps1",
            "scripts/uninstall_windows.ps1"
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.ToString() }
              exit 1
            }
            Write-Host "PowerShell syntax OK: $file"
          }
      - name: Exercise Windows uninstaller rollback and success paths
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # The malformed-config scenario intentionally expects a nonzero native process exit.
          $PSNativeCommandUseErrorActionPreference = $false
          $testRoot = Join-Path $env:RUNNER_TEMP "cadpilot-uninstall-test"
          if (Test-Path -LiteralPath $testRoot) {
            Remove-Item -LiteralPath $testRoot -Recurse -Force
          }
          $env:APPDATA = $testRoot
          $modRoot = Join-Path $testRoot "FreeCAD\v1-1\Mod"
          $addon = Join-Path $modRoot "AICopilot"
          $claudeDir = Join-Path $testRoot "Claude"
          $config = Join-Path $claudeDir "claude_desktop_config.json"
          New-Item -ItemType Directory -Force -Path $addon, $claudeDir | Out-Null
          Set-Content -LiteralPath (Join-Path $addon "marker.txt") -Value "installed"
          Set-Content -LiteralPath $config -Value '{"mcpServers":{"freecad":{"command":"python"},"other":{"command":"node"}}}'
          & scripts/uninstall_windows.ps1
          if (Test-Path -LiteralPath $addon) { throw "Add-on directory remains after successful uninstall." }
          $updated = Get-Content -Raw -LiteralPath $config | ConvertFrom-Json
          if ($null -ne $updated.mcpServers.PSObject.Properties["freecad"]) { throw "freecad config entry was not removed." }
          if ($null -eq $updated.mcpServers.PSObject.Properties["other"]) { throw "Unrelated MCP config entry was lost." }
          if (-not (Get-ChildItem -LiteralPath $claudeDir -Filter "claude_desktop_config.backup-*.json")) { throw "Claude config backup was not created." }

          # Malformed config must fail without moving or deleting the add-on.
          New-Item -ItemType Directory -Force -Path $addon | Out-Null
          Set-Content -LiteralPath (Join-Path $addon "marker.txt") -Value "still-installed"
          Set-Content -LiteralPath $config -Value '{"mcpServers":'
          $malformedConfigRejected = $false
          try {
            & scripts/uninstall_windows.ps1
          } catch {
            $malformedConfigRejected = $true
            Write-Host "Expected rejection: $($_.Exception.Message)"
          }
          if (-not $malformedConfigRejected) { throw "Uninstaller unexpectedly accepted malformed Claude JSON." }
          if (-not (Test-Path -LiteralPath (Join-Path $addon "marker.txt"))) { throw "Add-on was changed despite malformed Claude JSON." }
          Write-Host "Windows uninstaller success and rollback checks passed."
