name: Python tests

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Compile Python sources
        run: python -m compileall -q AICopilot freecad_mcp scripts
      - name: Run tests
        run: python -m pytest -q

  windows-script-validation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse Windows setup and uninstall scripts
        shell: pwsh
        run: |
          $files = @(
            "scripts/setup_windows.ps1",
            "scripts/uninstall_windows.ps1"
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.ToString() }
              exit 1
            }
            Write-Host "PowerShell syntax OK: $file"
          }
      - name: Exercise Windows uninstaller rollback and success paths
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # The malformed-config scenario intentionally expects a nonzero native process exit.
          $PSNativeCommandUseErrorActionPreference = $false
          $testRoot = Join-Path $env:RUNNER_TEMP "cadpilot-uninstall-test"
          if (Test-Path -LiteralPath $testRoot) {
            Remove-Item -LiteralPath $testRoot -Recurse -Force
          }
          $env:APPDATA = $testRoot
          $modRoot = Join-Path $testRoot "FreeCAD\v1-1\Mod"
          $addon = Join-Path $modRoot "AICopilot"
          $claudeDir = Join-Path $testRoot "Claude"
          $config = Join-Path $claudeDir "claude_desktop_config.json"
          New-Item -ItemType Directory -Force -Path $addon, $claudeDir | Out-Null
          Set-Content -LiteralPath (Join-Path $addon "marker.txt") -Value "installed"
          Set-Content -LiteralPath $config -Value '{"mcpServers":{"freecad":{"command":"python"},"other":{"command":"node"}}}'
          & .\scripts\uninstall_windows.ps1
          if (Test-Path -LiteralPath $addon) { throw "Add-on directory remains after successful uninstall." }
          $updated = Get-Content -Raw -LiteralPath $config | ConvertFrom-Json
          if ($null -ne $updated.mcpServers.PSObject.Properties["freecad"]) { throw "freecad config entry was not removed." }
          if ($null -eq $updated.mcpServers.PSObject.Properties["other"]) { throw "Unrelated MCP config entry was lost." }
          if (-not (Get-ChildItem -LiteralPath $claudeDir -Filter "claude_desktop_config.backup-*.json")) { throw "Claude config backup was not created." }

          # Malformed config must fail without moving or deleting the add-on.
          New-Item -ItemType Directory -Force -Path $addon | Out-Null
          Set-Content -LiteralPath (Join-Path $addon "marker.txt") -Value "still-installed"
          Set-Content -LiteralPath $config -Value '{"mcpServers":'
          $malformedConfigRejected = $false
          try {
            & .\scripts\uninstall_windows.ps1
          } catch {
            $malformedConfigRejected = $true
            Write-Host "Expected rejection: $($_.Exception.Message)"
          }
          if (-not $malformedConfigRejected) { throw "Uninstaller unexpectedly accepted malformed Claude JSON." }
          if (-not (Test-Path -LiteralPath (Join-Path $addon "marker.txt"))) { throw "Add-on was changed despite malformed Claude JSON." }

          # Syntactically valid JSON with an invalid Claude config shape must
          # also fail safely before the add-on is moved.
          foreach ($invalidConfig in @('[]', 'null', '"claude-config"', '{"mcpServers":[]}', '{"mcpServers":null}')) {
            Set-Content -LiteralPath $config -Value $invalidConfig
            $schemaRejected = $false
            try {
              & .\scripts\uninstall_windows.ps1
            } catch {
              $schemaRejected = $true
              Write-Host "Expected config-schema rejection: $($_.Exception.Message)"
            }
            if (-not $schemaRejected) { throw "Uninstaller accepted invalid Claude config shape: $invalidConfig" }
            if (-not (Test-Path -LiteralPath (Join-Path $addon "marker.txt"))) {
              throw "Add-on was changed despite invalid Claude config shape: $invalidConfig"
            }
          }

          # Force the config replacement to fail after the add-on has been
          # quarantined. The exclusive file handle simulates another process
          # holding Claude's config open; the uninstaller must restore the add-on.
          Set-Content -LiteralPath $config -Value '{"mcpServers":{"freecad":{"command":"python"},"other":{"command":"node"}}}'
          $configLock = [System.IO.File]::Open(
            $config,
            [System.IO.FileMode]::Open,
            [System.IO.FileAccess]::Read,
            [System.IO.FileShare]::None
          )
          $writeFailureRejected = $false
          try {
            & .\scripts\uninstall_windows.ps1
          } catch {
            $writeFailureRejected = $true
            Write-Host "Expected config-write rollback: $($_.Exception.Message)"
          } finally {
            $configLock.Dispose()
          }
          if (-not $writeFailureRejected) { throw "Uninstaller unexpectedly succeeded while Claude config was locked." }
          if (-not (Test-Path -LiteralPath (Join-Path $addon "marker.txt"))) {
            throw "Add-on was not restored after Claude config replacement failed."
          }
          $restoredConfig = Get-Content -Raw -LiteralPath $config | ConvertFrom-Json
          if ($null -eq $restoredConfig.mcpServers.PSObject.Properties["freecad"]) {
            throw "Claude config lost its freecad entry after rollback."
          }
          if (@(Get-ChildItem -LiteralPath $modRoot -Directory -Filter "AICopilot.uninstall-backup-*").Count -ne 0) {
            throw "Uninstaller left a quarantined add-on behind after rollback."
          }
          Write-Host "Windows uninstaller success and rollback checks passed."

      - name: Exercise Windows installer success and preflight rollback paths
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $testRoot = Join-Path $env:RUNNER_TEMP "cadpilot-setup-test"
          if (Test-Path -LiteralPath $testRoot) {
            Remove-Item -LiteralPath $testRoot -Recurse -Force
          }
          $project = Join-Path $testRoot "project"
          $scripts = Join-Path $project "scripts"
          $sourceAddon = Join-Path $project "AICopilot"
          $modRoot = Join-Path $testRoot "FreeCAD-Mod"
          New-Item -ItemType Directory -Force -Path $scripts, $sourceAddon, $modRoot | Out-Null
          Copy-Item ".\\scripts\\setup_windows.ps1" (Join-Path $scripts "setup_windows.ps1")
          $required = @(
            "InitGui.py",
            "socket_server.py",
            "security_policy.py",
            "request_validation.py",
            "export_validation.py"
          )
          foreach ($file in $required) {
            Copy-Item (Join-Path "AICopilot" $file) (Join-Path $sourceAddon $file)
          }

          # Successful update: previous add-on is backed up and all required
          # workbench files are present in the installed copy.
          $target = Join-Path $modRoot "AICopilot"
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Set-Content -LiteralPath (Join-Path $target "old-marker.txt") -Value "preserve-as-backup"
          & (Join-Path $scripts "setup_windows.ps1") -FreeCADModDirectory $modRoot -SkipPythonSetup -SkipClaudeConfig
          if (-not (Test-Path -LiteralPath (Join-Path $target "InitGui.py") -PathType Leaf)) { throw "Installer did not copy InitGui.py." }
          foreach ($file in $required) {
            if (-not (Test-Path -LiteralPath (Join-Path $target $file) -PathType Leaf)) { throw "Installed add-on is missing $file." }
          }
          $backups = @(Get-ChildItem -LiteralPath $modRoot -Directory -Filter "AICopilot.backup-*")
          if ($backups.Count -ne 1) { throw "Expected exactly one previous add-on backup; found $($backups.Count)." }
          if (-not (Test-Path -LiteralPath (Join-Path $backups[0].FullName "old-marker.txt"))) { throw "Previous add-on backup did not preserve its contents." }

          # A second rapid update must create another distinct backup rather
          # than collide with or overwrite the first backup.
          & (Join-Path $scripts "setup_windows.ps1") -FreeCADModDirectory $modRoot -SkipPythonSetup -SkipClaudeConfig
          $backupsAfterSecondUpdate = @(Get-ChildItem -LiteralPath $modRoot -Directory -Filter "AICopilot.backup-*")
          if ($backupsAfterSecondUpdate.Count -ne 2) { throw "Expected two distinct backups after two updates; found $($backupsAfterSecondUpdate.Count)." }
          if (@($backupsAfterSecondUpdate.Name | Select-Object -Unique).Count -ne 2) { throw "Repeated installer runs produced colliding backup names." }
          $installedBackups = @($backupsAfterSecondUpdate | Where-Object {
            Test-Path -LiteralPath (Join-Path $_.FullName "InitGui.py") -PathType Leaf
          })
          if ($installedBackups.Count -ne 1) {
            throw "Expected exactly one backup to contain the previously installed add-on; found $($installedBackups.Count)."
          }
          if (-not (Test-Path -LiteralPath (Join-Path $backupsAfterSecondUpdate.FullName "old-marker.txt") -PathType Leaf)) {
            throw "First backup did not preserve the original add-on marker."
          }

          # Preflight failure: an incomplete source must be rejected before
          # the currently installed add-on is moved or modified.
          Remove-Item -LiteralPath $target -Recurse -Force
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Set-Content -LiteralPath (Join-Path $target "live-marker.txt") -Value "must-survive"
          Remove-Item -LiteralPath (Join-Path $sourceAddon "export_validation.py") -Force
          $rejected = $false
          try {
            & (Join-Path $scripts "setup_windows.ps1") -FreeCADModDirectory $modRoot -SkipPythonSetup -SkipClaudeConfig
          } catch {
            $rejected = $true
            Write-Host "Expected installer rejection: $($_.Exception.Message)"
          }
          if (-not $rejected) { throw "Installer accepted an incomplete add-on source." }
          if (-not (Test-Path -LiteralPath (Join-Path $target "live-marker.txt"))) { throw "Installed add-on was modified after preflight rejection." }
          $backupCountAfterFailure = @(Get-ChildItem -LiteralPath $modRoot -Directory -Filter "AICopilot.backup-*").Count
          if ($backupCountAfterFailure -ne 2) { throw "Preflight failure unexpectedly changed backup state." }
          Write-Host "Windows installer success and preflight-preservation checks passed."

      - name: Verify default FreeCAD profile version selection
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $testRoot = Join-Path $env:RUNNER_TEMP "cadpilot-profile-selection-test"
          if (Test-Path -LiteralPath $testRoot) {
            Remove-Item -LiteralPath $testRoot -Recurse -Force
          }
          $env:APPDATA = $testRoot
          $freecadRoot = Join-Path $testRoot "FreeCAD"
          $newestMod = Join-Path $freecadRoot "v1-10\\Mod"
          $olderMod = Join-Path $freecadRoot "v1-9\\Mod"
          $legacyMod = Join-Path $freecadRoot "Mod"
          New-Item -ItemType Directory -Force -Path $newestMod, $olderMod, $legacyMod | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $olderMod "AICopilot"), (Join-Path $legacyMod "AICopilot") | Out-Null
          Set-Content -LiteralPath (Join-Path $olderMod "AICopilot\\marker.txt") -Value "older"
          Set-Content -LiteralPath (Join-Path $legacyMod "AICopilot\\marker.txt") -Value "legacy"

          # The installer should create/use v1-10, not v1-9 or the legacy root.
          & .\\scripts\\setup_windows.ps1 -SkipPythonSetup -SkipClaudeConfig
          $newestAddon = Join-Path $newestMod "AICopilot"
          if (-not (Test-Path -LiteralPath (Join-Path $newestAddon "InitGui.py"))) { throw "Installer did not select newest FreeCAD profile v1-10." }
          if (-not (Test-Path -LiteralPath (Join-Path $olderMod "AICopilot\\marker.txt"))) { throw "Installer modified older FreeCAD profile." }
          if (-not (Test-Path -LiteralPath (Join-Path $legacyMod "AICopilot\\marker.txt"))) { throw "Installer modified legacy FreeCAD profile." }

          # The uninstaller must apply the same selection and leave other profiles alone.
          & .\\scripts\\uninstall_windows.ps1
          if (Test-Path -LiteralPath $newestAddon) { throw "Uninstaller did not remove add-on from newest FreeCAD profile." }
          if (-not (Test-Path -LiteralPath (Join-Path $olderMod "AICopilot\\marker.txt"))) { throw "Uninstaller modified older FreeCAD profile." }
          if (-not (Test-Path -LiteralPath (Join-Path $legacyMod "AICopilot\\marker.txt"))) { throw "Uninstaller modified legacy FreeCAD profile." }
          Write-Host "Default FreeCAD profile selection checks passed (v1-10 selected over v1-9 and legacy)."
